<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skala Menüsü</title>
    <!-- Undertale Oyun Fontunu İnternetten Çekiyoruz -->
    <link href="https://cdnfonts.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Determination Mono', 'Segoe UI', sans-serif;
            background-color: #000000; /* Undertale ruhuna uygun siyah arka plan */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .container {
            background: #111111; /* Koyu tema kutusu */
            padding: 25px;
            border-radius: 15px;
            border: 3px solid #ffffff; /* Klasik Undertale beyaz çerçevesi */
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
            text-align: center;
            position: relative;
            width: 90%;
            max-width: 500px;
        }
        .baslik {
            font-family: 'Determination Mono', monospace;
            font-size: 26px; /* Undertale piksel fontu için ideal boyut */
            color: #ffffff; /* Beyaz yazı */
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .skala {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 140px;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        .cubuk-grup {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex: 1;
            touch-action: manipulation; 
        }
        .sayi {
            font-family: 'Determination Mono', monospace;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .cubuk {
            width: 85%;
            max-width: 25px;
            border-radius: 2px; /* Daha pikselsi bir görünüm için ovallik azaltıldı */
            transition: transform 0.1s;
            border: 1px solid #ffffff; /* Çubuklara Undertale çizgisi */
        }
        .cubuk-grup:active .cubuk {
            transform: scale(0.9);
        }
        .etiketler {
            font-family: 'Determination Mono', monospace;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #aaaaaa;
            padding: 0 5px;
            margin-top: 10px;
            letter-spacing: 1px;
        }
        #mesaj-alani {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: none;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
            background-color: rgba(0, 0, 0, 0.85); /* Yazı çıkınca arka planı karartır */
        }
        .mesaj-yazi {
            font-family: 'Determination Mono', monospace;
            font-size: 38px;
            text-align: center;
            text-transform: uppercase;
            display: none;
            letter-spacing: 2px;
            max-width: 100%;
            word-wrap: break-word;
        }
        .mesaj-emoji {
            font-size: 110px;
            display: none;
            animation: buyu 0.2s ease-out;
            margin-top: 15px;
        }
        @keyframes buyu {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- İstediğiniz yeni Undertale başlığı yerleştirildi -->
        <div class="baslik">BENİ NE KADAR SEVİYORSUN?</div>
        <div class="skala" id="skalaContainer"></div>
        <div class="etiketler">
            <span>EN AZ</span>
            <span>ORTA</span>
            <span>EN ÇOK</span>
        </div>
    </div>

    <div id="mesaj-alani" style="display: none;">
        <div id="yaziGosterici" class="mesaj-yazi"></div>
        <div id="emojiGosterici" class="mesaj-emoji"></div>
    </div>

    <script>
        const veriVeritabani = {
            0: { yazi: "HİÇ SEVMİYORSUN!", emoji: "💔", renk: "#ff4d4d" },
            1: { yazi: "ÇOK AZ SEVİYORSUN", emoji: "😢", renk: "#ff4d4d" },
            2: { yazi: "AZCIK SEVİYORSUN", emoji: "🙁", renk: "#ff7675" },
            3: { yazi: "BİRAZ SEVİYORSUN", emoji: "😐", renk: "#ff7675" },
            4: { yazi: "FENA DEĞİL", emoji: "🙂", renk: "#2ecc71" },
            5: { yazi: "TAM ORTADASIN YA DA?", emoji: "🤔", renk: "#2ecc71" },
            6: { yazi: "SEVİYORSUN GİBİ", emoji: "😊", renk: "#2ecc71" },
            7: { yazi: "BAYA SEVİYORSUN", emoji: "😃", renk: "#3498db" },
            8: { yazi: "BENI BU KADAR COK MU SEVIYORSUN", emoji: "🥰", renk: "#ff7675" },
            9: { yazi: "AŞIK OLMUŞSUN!", emoji: "😍", renk: "#f1c40f" },
            10: { yazi: "ÇILGINLAR GİBİ SEVİYORSUN!", emoji: "❤️", renk: "#e74c3c" }
        };

        const YAZI_SURESI = 1500;  
        const EMOJI_SURESI = 1500; 

        let tiklamaKilitli = false; 

        const skalaContainer = document.getElementById('skalaContainer');
        const mesajAlani = document.getElementById('mesaj-alani');
        const yaziGosterici = document.getElementById('yaziGosterici');
        const emojiGosterici = document.getElementById('emojiGosterici');

        for (let i = 0; i <= 10; i++) {
            const grup = document.createElement('div');
            grup.className = 'cubuk-grup';
            grup.onclick = () => eylemiBaslat(i);

            const sayiText = document.createElement('div');
            sayiText.className = 'sayi';
            sayiText.innerText = i;

            const cubuk = document.createElement('div');
            cubuk.className = 'cubuk';
            const boy = 30 + (i * 8); 
            cubuk.style.height = boy + 'px';
            cubuk.style.backgroundColor = veriVeritabani[i].renk;

            grup.appendChild(sayiText);
            grup.appendChild(cubuk);
            skalaContainer.appendChild(grup);
        }

        function eylemiBaslat(sayi) {
            if (tiklamaKilitli) return; 
            tiklamaKilitli = true;

            const ses = new Audio('ses' + sayi + '.mp3');
            ses.play().catch(e => console.log("Ses engellendi:", e));

            const veri = veriVeritabani[sayi];

            mesajAlani.style.display = 'flex';
            yaziGosterici.style.display = 'none';
            emojiGosterici.style.display = 'none';

            yaziGosterici.innerText = veri.yazi;
            yaziGosterici.style.color = veri.renk;
            yaziGosterici.style.display = 'block';

            setTimeout(() => {
                yaziGosterici.style.display = 'none';
                
                emojiGosterici.innerText = veri.emoji;
                emojiGosterici.style.display = 'block';

                setTimeout(() => {
                    emojiGosterici.style.display = 'none';
                    mesajAlani.style.display = 'none';
                    tiklamaKilitli = false; 
                }, EMOJI_SURESI);

            }, YAZI_SURESI);
        }
    </script>
</body>
</html>
